[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explosions-core"
version = "0.1.0"
description = "Инженерное расчетное ядро проектирования складов ВМ для карьеров (Приказ МИР РК № 343)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "ezdxf>=1.3",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
gui = [
    "PySide6-Essentials>=6.6",
]

[project.scripts]
explosions-core = "explosions_core.cli:main"

[project.gui-scripts]
explosions-gui = "explosions_core.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["explosions_core*"]

[tool.setuptools.package-data]
"explosions_core.norms" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
